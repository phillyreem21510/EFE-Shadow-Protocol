    // ========== COVER POINTS (from existing crates, barriers, inner walls) ==========
    // Stand positions adjacent to solid props — enemies use these when under fire.
    const COVER_SPOTS = [];
    function addCoverAround(cx, cz, radius) {
      const offsets = [
        [radius, 0], [-radius, 0], [0, radius], [0, -radius],
        [radius * 0.7, radius * 0.7], [-radius * 0.7, radius * 0.7],
        [radius * 0.7, -radius * 0.7], [-radius * 0.7, -radius * 0.7]
      ];
      offsets.forEach(([ox, oz]) => {
        const p = new BABYLON.Vector3(cx + ox, 0, cz + oz);
        // Only keep standable spots inside the arena
        if (Math.abs(p.x) < 19 && Math.abs(p.z) < 19 && canMoveTo(p)) {
          COVER_SPOTS.push({ pos: p, anchor: new BABYLON.Vector3(cx, 0, cz) });
        }
      });
    }
    // Crates
    cratePositions.forEach(([x, z]) => addCoverAround(x, z, 1.55));
    // Barriers
    [[0, 0], [-5, 5], [7, -8], [-11, -8]].forEach(([x, z]) => addCoverAround(x, z, 1.9));
    // Inner wall midpoints (stand beside them)
    [[-8, -6], [6, 8], [-4, 10], [10, -4], [-12, 4], [4, -12]].forEach(([x, z]) => {
      addCoverAround(x, z, 1.7);
    });

    // Rough LOS / blockage sample between two ground points
    function lineBlocked(a, b, samples) {
      const n = samples || 4;
      for (let i = 1; i < n; i++) {
        const t = i / n;
        const p = BABYLON.Vector3.Lerp(a, b, t);
        p.y = 0;
        if (!canMoveTo(p)) return true;
      }
      return false;
    }

    // Is this cover spot useful vs the player? Anchor should sit roughly between spot and player.
    function coverProtects(spot, fromPos, playerPos) {
      // Vector from cover stand → player should pass near the anchor (prop)
      const toPlayer = playerPos.subtract(spot.pos);
      toPlayer.y = 0;
      if (toPlayer.length() < 1.5) return false;
      const toAnchor = spot.anchor.subtract(spot.pos);
      toAnchor.y = 0;
      // Anchor roughly in the direction of the player from the stand point
      const dot = BABYLON.Vector3.Dot(toPlayer.normalize(), toAnchor.normalize());
      if (dot < 0.15) return false;
      // Prefer spots where path from stand to player is blocked by geometry
      const blocked = lineBlocked(spot.pos, playerPos, 5);
      return blocked || dot > 0.45;
    }

    function findCoverSpot(enemyPos, playerPos, currentSpot) {
      let best = null;
      let bestScore = -Infinity;
      for (let i = 0; i < COVER_SPOTS.length; i++) {
        const spot = COVER_SPOTS[i];
        if (currentSpot && spot.pos.equals(currentSpot)) continue;
        const dist = BABYLON.Vector3.Distance(enemyPos, spot.pos);
        if (dist < 1.2 || dist > 14) continue;
        if (!canMoveTo(spot.pos)) continue;
        if (!coverProtects(spot, enemyPos, playerPos)) continue;
        // Prefer closer cover that is farther from the player than we currently are
        const distToPlayer = BABYLON.Vector3.Distance(spot.pos, playerPos);
        const myDist = BABYLON.Vector3.Distance(enemyPos, playerPos);
        let score = distToPlayer * 0.4 - dist * 0.8;
        if (distToPlayer > myDist * 0.7) score += 2;
        // Slight preference for not the same region
        if (score > bestScore) {
          bestScore = score;
          best = spot;
        }
      }
      return best;
    }

    // Steering toward a point while sliding around obstacles
    function moveToward(e, target, speed, dt) {
      const toT = target.subtract(e.root.position);
      toT.y = 0;
      const dist = toT.length();
      if (dist < 0.45) return true; // arrived
      toT.normalize();
      const step = speed * dt;
      let next = e.root.position.add(toT.scale(step));
      if (canMoveTo(next)) {
        e.root.position.copyFrom(next);
        e.root.rotation.y = Math.atan2(toT.x, toT.z);
        return false;
      }
      // Try perpendicular slides
      const perp1 = new BABYLON.Vector3(-toT.z, 0, toT.x);
      const perp2 = new BABYLON.Vector3(toT.z, 0, -toT.x);
      for (const p of [perp1, perp2]) {
        next = e.root.position.add(p.scale(step * 0.9)).add(toT.scale(step * 0.35));
        if (canMoveTo(next)) {
          e.root.position.copyFrom(next);
          e.root.rotation.y = Math.atan2(toT.x, toT.z);
          return false;
        }
      }
      // Pure slide along axes
      const nx = e.root.position.clone(); nx.x += toT.x * step;
      const nz = e.root.position.clone(); nz.z += toT.z * step;
      if (canMoveTo(nx)) e.root.position.x = nx.x;
      else if (canMoveTo(nz)) e.root.position.z = nz.z;
      e.root.rotation.y = Math.atan2(toT.x, toT.z);
      return false;
    }

    function createEnemy(x, z, patrolPoints) {
      const root = new BABYLON.TransformNode('eRoot', scene);
      root.position = new BABYLON.Vector3(x, 0, z);

      const body = BABYLON.MeshBuilder.CreateCapsule('eBody', { height: 1.6, radius: 0.32 }, scene);
      body.parent = root;
      body.position.y = 0.8;
      body.material = enemyMat;
      shadowGen.addShadowCaster(body);

      const eHead = BABYLON.MeshBuilder.CreateSphere('eHead', { diameter: 0.38 }, scene);
      eHead.parent = root;
      eHead.position.y = 1.65;
      eHead.material = enemyMat;

      // Helmet shell (covers face silhouette)
      const helmet = BABYLON.MeshBuilder.CreateSphere('helm', { diameter: 0.44, segments: 8 }, scene);
      helmet.parent = eHead;
      helmet.position.y = 0.04;
      helmet.material = enemyMat;

      // Glowing orange goggles (Enforcer signature)
      const goggleL = BABYLON.MeshBuilder.CreateSphere('gL', { diameter: 0.13, segments: 6 }, scene);
      goggleL.parent = eHead;
      goggleL.position = new BABYLON.Vector3(-0.075, 0.01, 0.17);
      goggleL.material = goggleMat;
      const goggleR = BABYLON.MeshBuilder.CreateSphere('gR', { diameter: 0.13, segments: 6 }, scene);
      goggleR.parent = eHead;
      goggleR.position = new BABYLON.Vector3(0.075, 0.01, 0.17);
      goggleR.material = goggleMat;

      // Tactical vest plate
      const vest = BABYLON.MeshBuilder.CreateBox('vest', { width: 0.42, height: 0.32, depth: 0.16 }, scene);
      vest.parent = body;
      vest.position = new BABYLON.Vector3(0, 0.12, 0.2);
      vest.material = vestMat;

      // Shoulder pads
      const padL = BABYLON.MeshBuilder.CreateBox('padL', { width: 0.16, height: 0.1, depth: 0.2 }, scene);
      padL.parent = body;
      padL.position = new BABYLON.Vector3(-0.26, 0.32, 0);
      padL.material = vestMat;
      const padR = BABYLON.MeshBuilder.CreateBox('padR', { width: 0.16, height: 0.1, depth: 0.2 }, scene);
      padR.parent = body;
      padR.position = new BABYLON.Vector3(0.26, 0.32, 0);
      padR.material = vestMat;

      const eGun = BABYLON.MeshBuilder.CreateBox('eGun', { width: 0.1, height: 0.12, depth: 0.5 }, scene);
      eGun.parent = root;
      eGun.position = new BABYLON.Vector3(0.25, 1.1, 0.3);
      eGun.material = gunMat;

      const extras = [helmet, goggleL, goggleR, vest, padL, padR];

      const e = {
        root, body, head: eHead, gun: eGun, extras,
        hp: 60, maxHp: 60, alive: true,
        state: 'patrol',
        patrolPoints, patrolIdx: 0,
        detectRange: 11, attackRange: 9,
        shootTimer: 0, speed: 3.2,
        lastKnown: null, alert: 0,
        // Combat feedback state
        flinchTimer: 0,
        flinchDir: new BABYLON.Vector3(0, 0, 0),
        hitFlashTimer: 0,
        deathTimer: 0,
        collapsing: false,
        baseBodyY: 0.8,
        baseHeadY: 1.65,
        // Cover behavior
        coverSpot: null,       // { pos, anchor }
        coverCooldown: 0,       // decision cooldown
        coverHoldTimer: 0,     // time spent in cover before peek
        peekTimer: 0,          // time spent peeking / firing
        coverFailTimer: 0      // abandon seek if stuck
      };
      enemies.push(e);
      return e;
    }

    function damageEnemy(e, amount, hitDir) {
      if (!e.alive || e.collapsing) return;
      e.hp -= amount;

      // Flinch + knockback (rate-limited)
      if (e.flinchTimer <= 0) {
        e.flinchTimer = 0.18;
        e.flinchDir.copyFrom(hitDir);
        e.flinchDir.y = 0;
        if (e.flinchDir.length() > 0.01) e.flinchDir.normalize();
      }
      // Brief material flash (won't restart if already flashing)
      if (e.hitFlashTimer <= 0) {
        e.hitFlashTimer = 0.1;
        e.body.material = hitFlashMat;
        e.head.material = hitFlashMat;
      }

      // Impact flash at chest
      const hitPos = e.root.position.add(new BABYLON.Vector3(0, 1.1, 0)).add(hitDir.scale(-0.3));
      spawnFlash(hitPos, new BABYLON.Color3(1, 0.6, 0.2), 0.45, 0.11);
      sfxHit();

      // Small knockback
      const kb = e.root.position.add(hitDir.scale(0.35));
      if (canMoveTo(kb)) e.root.position.copyFrom(kb);

      // Cover decision: under fire → seek nearby cover (with cooldown)
      if (e.hp > 0 && e.coverCooldown <= 0 &&
          e.state !== 'seekCover' && e.state !== 'inCover' && e.state !== 'peekFire') {
        const spot = findCoverSpot(e.root.position, playerRoot.position, null);
        if (spot) {
          e.coverSpot = spot;
          e.state = 'seekCover';
          e.coverFailTimer = 4.5;
          e.coverCooldown = 3.5; // prevent rapid re-decisions
          e.alert = 4;
        }
      }

      if (e.hp <= 0) {
        killEnemy(e, hitDir);
      }
    }

    // ========== ENCOUNTER / MISSION STATE ==========
    let hostilesRemaining = 3;
    let sectorSecured = false;
    const hostilesCountEl = document.getElementById('hostilesCount');
    const camerasCountEl = document.getElementById('camerasCount');
    const hostilesLineEl = document.getElementById('hostilesLine');
    const camerasLineEl = document.getElementById('camerasLine');
    const missionHudEl = document.getElementById('missionHud');
    const replayBtn = document.getElementById('replayBtn');

    function updateMissionHud() {
      if (hostilesCountEl) hostilesCountEl.textContent = String(hostilesRemaining);
      if (camerasCountEl) camerasCountEl.textContent = String(camerasOnline);
      if (hostilesLineEl) {
        if (hostilesRemaining <= 0) hostilesLineEl.classList.add('cleared');
        else hostilesLineEl.classList.remove('cleared');
      }
      if (camerasLineEl) {
        if (camerasOnline <= 0) camerasLineEl.classList.add('cleared');
        else camerasLineEl.classList.remove('cleared');
      }
      if (missionHudEl) {
        if (hostilesRemaining <= 0 && camerasOnline <= 0) missionHudEl.classList.add('complete');
        else missionHudEl.classList.remove('complete');
      }
    }
    // Back-compat alias used by older calls
    function updateHostilesHud() { updateMissionHud(); }

    function checkMissionComplete() {
      if (sectorSecured) return;
      if (hostilesRemaining <= 0 && camerasOnline <= 0) {
        sectorSecured = true;
        setTimeout(() => {
          showMsg('SECTOR SECURED\nR.E.D. SURVEILLANCE DISRUPTED', 4.5);
          if (replayBtn) replayBtn.classList.add('visible');
        }, 700);
      }
    }

    function destroyCamera(cam, hitPos) {
      if (!cam.alive) return;
      cam.alive = false;
      cam.hp = 0;
      cam.lite.material = camLightOffMat;
      cam.body.material = deadMat;
      cam.lens.material = deadMat;
      cam.root.rotation.z = 0.35;
      cam.root.rotation.x = 0.2;
      if (hitPos) {
        spawnFlash(hitPos, new BABYLON.Color3(1, 0.4, 0.15), 0.55, 0.15);
        spawnSparks(hitPos, 5);
      }
      sfxKill();
      if (camerasOnline > 0) {
        camerasOnline -= 1;
        updateMissionHud();
      }
      showMsg('CAMERA DISABLED', 1.0);
      checkMissionComplete();
    }

    function damageCamera(cam, amount, hitPos) {
      if (!cam.alive) return;
      cam.hp -= amount;
      if (cam.hitFlashTimer <= 0) {
        cam.hitFlashTimer = 0.12;
        cam.body.material = hitFlashMat;
        // Briefly intensify the indicator light on hit
        cam.lite.material = camLightOnMat;
        cam.lite.scaling.setAll(1.6);
      }
      const p = hitPos || cam.body.getAbsolutePosition();
      spawnFlash(p, new BABYLON.Color3(1, 0.5, 0.2), 0.4, 0.12);
      sfxHit();
      if (cam.hp <= 0) {
        destroyCamera(cam, p);
      }
    }

    function killEnemy(e, hitDir) {
      if (!e.alive) return; // count each enemy only once
      e.alive = false;
      e.collapsing = true;
      e.deathTimer = 2.2;
      e.state = 'dead';
      e.shootTimer = 999;
      e.body.material = deadMat;
      e.head.material = deadMat;
      const tip = hitDir && hitDir.length() > 0.01
        ? Math.atan2(hitDir.x, hitDir.z) + Math.PI
        : e.root.rotation.y;
      e.collapseYaw = tip;
      sfxKill();

      if (hostilesRemaining > 0) {
        hostilesRemaining -= 1;
        updateMissionHud();
      }
      showMsg('HOSTILE DOWN', 0.9);
      checkMissionComplete();
    }

    // Spawn data for replay resets
    const ENEMY_SPAWNS = [
      { x: -10, z: 12, patrol: [
        new BABYLON.Vector3(-10, 0, 12),
        new BABYLON.Vector3(-4, 0, 14),
        new BABYLON.Vector3(-12, 0, 6)
      ]},
      { x: 12, z: 6, patrol: [
        new BABYLON.Vector3(12, 0, 6),
        new BABYLON.Vector3(14, 0, -2),
        new BABYLON.Vector3(8, 0, 10)
      ]},
      { x: -6, z: -4, patrol: [
        new BABYLON.Vector3(-6, 0, -4),
        new BABYLON.Vector3(-14, 0, -6),
        new BABYLON.Vector3(-2, 0, 2)
      ]}
    ];

    function resetEncounter() {
      // Player
      playerRoot.position.set(0, 0, -14);
      playerRoot.rotation.y = 0;
      playerHP = maxHP;
      playerAlive = true;
      updateHealthUI();
      aimDir.set(0, 0, 1);
      smoothedAim.set(0, 0, 1);
      gunRecoil = 0;
      if (typeof gunBasePos !== 'undefined') gun.position.copyFrom(gunBasePos);

      // Scan
      scanActive = false;
      scanTimer = 0;
      scanCooldown = 0;
      scanBtn.classList.remove('cooldown', 'active');
      const scanLab = scanBtn.querySelector('#scanLabel');
      if (scanLab) scanLab.textContent = 'SCAN';

      // Clear bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        try { bullets[i].mesh.material.dispose(); bullets[i].mesh.dispose(); } catch (err) {}
        bullets.splice(i, 1);
      }
      // Clear FX
      for (let i = activeFx.length - 1; i >= 0; i--) {
        const f = activeFx[i];
        try {
          if (f.isSpark) { f.mesh.material.dispose(); f.mesh.dispose(); }
          else { f.mesh.setEnabled(false); fxPool.push(f.mesh); }
        } catch (err) {}
        activeFx.splice(i, 1);
      }

      // Reset each enemy in place (no new objects / listeners)
      enemies.forEach((e, idx) => {
        const spawn = ENEMY_SPAWNS[idx];
        e.alive = true;
        e.collapsing = false;
        e.hp = e.maxHp;
        e.state = 'patrol';
        e.patrolIdx = 0;
        e.shootTimer = 0;
        e.alert = 0;
        e.lastKnown = null;
        e.flinchTimer = 0;
        e.hitFlashTimer = 0;
        e.deathTimer = 0;
        e.coverSpot = null;
        e.coverCooldown = 0;
        e.coverHoldTimer = 0;
        e.peekTimer = 0;
        e.coverFailTimer = 0;
        e.patrolPoints = spawn.patrol;
        e.root.setEnabled(true);
        e.root.position.set(spawn.x, 0, spawn.z);
        e.root.rotation.set(0, 0, 0);
        e.body.setEnabled(true);
        e.head.setEnabled(true);
        e.gun.setEnabled(true);
        e.body.visibility = 1;
        e.head.visibility = 1;
        e.gun.visibility = 1;
        if (e.extras) {
          for (const m of e.extras) {
            m.visibility = 1;
            m.setEnabled(true);
          }
        }
        e.body.position.y = e.baseBodyY;
        e.head.position.y = e.baseHeadY;
        e.gun.position.set(0.25, 1.1, 0.3);
        e.gun.rotation.set(0, 0, 0);
        e.body.rotation.set(0, 0, 0);
        e.body.material = enemyMat;
        e.head.material = enemyMat;
      });

      // Reset cameras
      cameras.forEach(cam => {
        cam.alive = true;
        cam.hp = cam.maxHp;
        cam.hitFlashTimer = 0;
        cam.lite.material = camLightOnMat;
        cam.body.material = camBodyMat;
        cam.lens.material = camLensMat;
        cam.root.rotation.x = 0;
        cam.root.rotation.z = 0;
        cam.body.setEnabled(true);
        cam.lens.setEnabled(true);
        cam.lite.setEnabled(true);
        cam.arm.setEnabled(true);
        cam.root.setEnabled(true);
      });
      camerasOnline = cameras.length;

      hostilesRemaining = enemies.length;
      sectorSecured = false;
      updateMissionHud();
      if (replayBtn) replayBtn.classList.remove('visible');
      showMsg('MISSION: FIRST SIGNAL\nOBJECTIVE: DISABLE R.E.D. SURVEILLANCE', 2.5);
    }

    replayBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      resetEncounter();
    });
    replayBtn.addEventListener('touchstart', e => {
      e.preventDefault(); e.stopPropagation();
      resetEncounter();
    }, { passive: false });

    function updateEnemyFeedback(e, dt) {
      // Flinch recovery
      if (e.flinchTimer > 0) {
        e.flinchTimer -= dt;
        // Slight lean away from hit
        const lean = Math.min(1, e.flinchTimer / 0.18) * 0.18;
        e.body.rotation.x = -lean * e.flinchDir.z;
        e.body.rotation.z = lean * e.flinchDir.x;
        e.head.position.y = e.baseHeadY - lean * 0.15;
      } else if (!e.collapsing) {
        e.body.rotation.x *= 0.7;
        e.body.rotation.z *= 0.7;
        e.head.position.y = e.baseHeadY;
      }

      // Hit flash end
      if (e.hitFlashTimer > 0) {
        e.hitFlashTimer -= dt;
        if (e.hitFlashTimer <= 0 && e.alive) {
          e.body.material = scanActive ? highlightMat : enemyMat;
          e.head.material = scanActive ? highlightMat : enemyMat;
        }
      }

      // Collapse animation then fade
      if (e.collapsing) {
        e.deathTimer -= dt;
        const progress = 1 - Math.max(0, e.deathTimer - 0.4) / 1.8; // 0→1 over collapse
        // Fall over
        const fallAmt = Math.min(1, progress * 1.6);
        e.root.rotation.x = fallAmt * (Math.PI / 2) * 0.95;
        e.body.position.y = e.baseBodyY * (1 - fallAmt * 0.5);
        e.head.position.y = e.baseHeadY - fallAmt * 0.9;
        e.gun.position.y = 1.1 - fallAmt * 0.7;
        e.gun.rotation.x = fallAmt * 0.8;
        // Fade in last 0.6s (per-mesh visibility, shared mat stays opaque)
        if (e.deathTimer < 0.6) {
          const a = Math.max(0, e.deathTimer / 0.6);
          e.body.visibility = a;
          e.head.visibility = a;
          e.gun.visibility = a;
          if (e.extras) for (const m of e.extras) m.visibility = a;
        }
        if (e.deathTimer <= 0) {
          e.collapsing = false;
          e.body.setEnabled(false);
          e.head.setEnabled(false);
          e.gun.setEnabled(false);
          if (e.extras) for (const m of e.extras) m.setEnabled(false);
          e.root.setEnabled(false);
        }
      }
    }

    createEnemy(-10, 12, [
      new BABYLON.Vector3(-10, 0, 12),
      new BABYLON.Vector3(-4, 0, 14),
      new BABYLON.Vector3(-12, 0, 6)
    ]);
    createEnemy(12, 6, [
      new BABYLON.Vector3(12, 0, 6),
      new BABYLON.Vector3(14, 0, -2),
      new BABYLON.Vector3(8, 0, 10)
    ]);
    createEnemy(-6, -4, [
      new BABYLON.Vector3(-6, 0, -4),
      new BABYLON.Vector3(-14, 0, -6),
      new BABYLON.Vector3(-2, 0, 2)
    ]);

    // UI elements
    const healthFill = document.getElementById('healthFill');
    const healthText = document.getElementById('healthText');
    const scanBtn = document.getElementById('scanBtn');
    const msgEl = document.getElementById('msg');
    const moveBase = document.getElementById('moveBase');
    const moveKnob = document.getElementById('moveKnob');
    const moveZone = document.getElementById('moveZone');
    const aimBase = document.getElementById('aimBase');
    const aimKnob = document.getElementById('aimKnob');
    const aimZone = document.getElementById('aimZone');
    const fireBtn = document.getElementById('fireBtn');
    const modeToggle = document.getElementById('modeToggle');
    const modeNameEl = document.getElementById('modeName');
    const modeLabelEl = document.getElementById('modeLabel');
    const aimHintEl = document.getElementById('aimHint');

    function showMsg(text, duration = 1.5) {
      msgEl.textContent = text;
      msgEl.classList.add('show');
      setTimeout(() => msgEl.classList.remove('show'), duration * 1000);
    }

    function updateHealthUI() {
      const pct = Math.max(0, playerHP / maxHP * 100);
      healthFill.style.width = pct + '%';
      healthText.textContent = Math.ceil(playerHP);
      if (pct < 30) healthFill.style.background = 'linear-gradient(90deg, #8b0000, #c0392b)';
      else healthFill.style.background = 'linear-gradient(90deg, #c0392b, #e74c3c)';
    }

    // ========== CONTROL MODE (A = twin-stick fire, B = independent aim + fire btn) ==========
    // Mode A: right stick aims AND fires while held (original)
    // Mode B: right stick aims only; separate FIRE button shoots
    let controlMode = 'A'; // 'A' or 'B'
    let fireBtnHeld = false;
    let fireTouchId = null;

    function applyControlMode() {
      // Always clear fire-button state on mode switch
      fireBtnHeld = false;
      fireTouchId = null;
      fireBtn.classList.remove('pressed');
      if (controlMode === 'A') {
        modeNameEl.textContent = 'A';
        modeLabelEl.textContent = 'Twin-Stick Fire';
        fireBtn.classList.remove('visible');
        aimHintEl.textContent = 'AIM / FIRE';
      } else {
        modeNameEl.textContent = 'B';
        modeLabelEl.textContent = 'Aim + Fire Btn';
        fireBtn.classList.add('visible');
        aimHintEl.textContent = 'AIM ONLY';
      }
      // isShooting is re-derived every frame from aimActive / fireBtnHeld
    }
    modeToggle.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      controlMode = controlMode === 'A' ? 'B' : 'A';
      applyControlMode();
      showMsg(controlMode === 'A' ? 'MODE A — Twin-Stick Fire' : 'MODE B — Aim + Fire Button', 1.4);
    });
    modeToggle.addEventListener('touchstart', e => {
      e.preventDefault();
      e.stopPropagation();
      controlMode = controlMode === 'A' ? 'B' : 'A';
      applyControlMode();
      showMsg(controlMode === 'A' ? 'MODE A — Twin-Stick Fire' : 'MODE B — Aim + Fire Button', 1.4);
    }, { passive: false });
    applyControlMode();

    // ========== TWIN-STICK CONTROLS ==========
    const JOY_R = 52;               // visual radius
    const AIM_SENSITIVITY = 1.15;   // adjustable aim stick sensitivity
    const AIM_SMOOTH = 0.22;        // higher = snappier, lower = smoother
    const AIM_ASSIST_ANGLE = 0.38;  // radians (~22°) cone for assist
    const AIM_ASSIST_STRENGTH = 0.55;
    const AIM_ASSIST_RANGE = 14;    // max distance for assist

    let moveActive = false;
    let moveOrigin = { x: 0, y: 0 };
    let moveTouchId = null;

    let aimActive = false;
    let aimOrigin = { x: 0, y: 0 };
    let aimTouchId = null;
    let rawAimInput = new BABYLON.Vector2(0, 0); // current stick vector
    let smoothedAim = new BABYLON.Vector3(0, 0, 1); // smoothed world direction

    // Visual aim line (3D) — thin box we orient each frame
    const aimLine = BABYLON.MeshBuilder.CreateBox('aimLine', {
      width: 0.06, height: 0.06, depth: 9
    }, scene);
    const aimLineMat = new BABYLON.StandardMaterial('aimLineMat', scene);
    aimLineMat.emissiveColor = new BABYLON.Color3(0.25, 0.7, 1);
    aimLineMat.alpha = 0.5;
    aimLineMat.disableLighting = true;
    aimLine.material = aimLineMat;
    aimLine.isVisible = false;
    aimLine.isPickable = false;

    // --- Move stick ---
    function startMove(cx, cy, id) {
      moveActive = true;
      moveTouchId = id;
      moveOrigin = { x: cx, y: cy };
      moveBase.style.display = 'block';
      moveBase.style.left = (cx - 60) + 'px';
      moveBase.style.top = (cy - 60) + 'px';
      moveKnob.style.left = '33px';
      moveKnob.style.top = '33px';
    }
    function updateMove(cx, cy) {
      if (!moveActive) return;
      let dx = cx - moveOrigin.x;
      let dy = cy - moveOrigin.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len > JOY_R) { dx = (dx / len) * JOY_R; dy = (dy / len) * JOY_R; }
      moveKnob.style.left = (33 + dx) + 'px';
      moveKnob.style.top = (33 + dy) + 'px';
      moveInput.x = dx / JOY_R;
      moveInput.y = -dy / JOY_R; // screen up = +Z
    }
    function endMove() {
      moveActive = false;
      moveTouchId = null;
      moveInput.set(0, 0);
      moveBase.style.display = 'none';
    }

    // --- Aim stick ---
    // Mode A: aim stick also drives firing (via isShooting derivation in main loop)
    // Mode B: aim stick ONLY aims; firing is exclusively via FIRE button
    function startAim(cx, cy, id) {
      aimActive = true;
      aimTouchId = id;
      aimOrigin = { x: cx, y: cy };
      aimBase.style.display = 'block';
      aimBase.style.left = (cx - 60) + 'px';
      aimBase.style.top = (cy - 60) + 'px';
      aimKnob.style.left = '33px';
      aimKnob.style.top = '33px';
      rawAimInput.set(0, 0);
      // Do NOT snap aimDir — keep current facing to avoid jumps
    }
    function updateAim(cx, cy) {
      if (!aimActive) return;
      let dx = (cx - aimOrigin.x) * AIM_SENSITIVITY;
      let dy = (cy - aimOrigin.y) * AIM_SENSITIVITY;
      const len = Math.sqrt(dx * dx + dy * dy);
      const maxR = JOY_R * AIM_SENSITIVITY;
      if (len > maxR) { dx = (dx / len) * maxR; dy = (dy / len) * maxR; }
      const vLen = Math.min(len / AIM_SENSITIVITY, JOY_R);
      const vx = len > 0.01 ? (dx / len) * vLen : 0;
      const vy = len > 0.01 ? (dy / len) * vLen : 0;
      aimKnob.style.left = (33 + vx) + 'px';
      aimKnob.style.top = (33 + vy) + 'px';
      rawAimInput.x = dx / maxR;
      rawAimInput.y = -dy / maxR;
    }
    function endAim() {
      aimActive = false;
      aimTouchId = null;
      rawAimInput.set(0, 0);
      aimBase.style.display = 'none';
      // Aim direction (smoothedAim / aimDir) is preserved so Mode B can
      // keep firing in the last aimed direction after releasing the stick.
    }

    // Helper: is this point over the FIRE button?
    function isOverFireBtn(cx, cy) {
      if (controlMode !== 'B' || !fireBtn.classList.contains('visible')) return false;
      const r = fireBtn.getBoundingClientRect();
      // Expand hit area slightly for fat fingers
      const pad = 8;
      return cx >= r.left - pad && cx <= r.right + pad &&
             cy >= r.top - pad && cy <= r.bottom + pad;
    }
    // Helper: is this point over SCAN button?
    function isOverScanBtn(cx, cy) {
      const r = scanBtn.getBoundingClientRect();
      const pad = 6;
      return cx >= r.left - pad && cx <= r.right + pad &&
             cy >= r.top - pad && cy <= r.bottom + pad;
    }

    // Touch handlers for both zones
    function onTouchStart(e, isMoveZone) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        // Never let aim zone steal FIRE or SCAN touches
        if (!isMoveZone && (isOverFireBtn(t.clientX, t.clientY) || isOverScanBtn(t.clientX, t.clientY))) {
          continue;
        }
        if (isMoveZone && moveTouchId === null) {
          startMove(t.clientX, t.clientY, t.identifier);
        } else if (!isMoveZone && aimTouchId === null) {
          startAim(t.clientX, t.clientY, t.identifier);
        }
      }
    }
    function onTouchMove(e) {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === moveTouchId) updateMove(t.clientX, t.clientY);
        if (t.identifier === aimTouchId) updateAim(t.clientX, t.clientY);
      }
    }
    function onTouchEnd(e) {
      for (const t of e.changedTouches) {
        if (t.identifier === moveTouchId) endMove();
        if (t.identifier === aimTouchId) endAim();
        if (t.identifier === fireTouchId) endFire();
      }
    }

    moveZone.addEventListener('touchstart', e => onTouchStart(e, true), { passive: false });
    aimZone.addEventListener('touchstart', e => onTouchStart(e, false), { passive: false });
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd, { passive: false });
    window.addEventListener('touchcancel', onTouchEnd, { passive: false });

    // --- FIRE button (Mode B only) — independent touch channel ---
    function startFire(id) {
      if (controlMode !== 'B') return;
      fireBtnHeld = true;
      fireTouchId = id;
      isShooting = true;
      fireBtn.classList.add('pressed');
    }
    function endFire() {
      if (fireTouchId === null && !fireBtnHeld) return;
      fireBtnHeld = false;
      fireTouchId = null;
      fireBtn.classList.remove('pressed');
      // Only clear shooting in Mode B; Mode A is driven by aim stick
      if (controlMode === 'B') {
        isShooting = false;
      }
    }

    // Capture phase so FIRE gets the event before aimZone
    fireBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      if (controlMode !== 'B') return;
      for (const t of e.changedTouches) {
        if (fireTouchId === null) {
          startFire(t.identifier);
          break;
        }
      }
    }, { passive: false, capture: true });

    fireBtn.addEventListener('touchend', e => {
      e.preventDefault();
      e.stopPropagation();
      for (const t of e.changedTouches) {
        if (t.identifier === fireTouchId) endFire();
      }
    }, { passive: false, capture: true });

    fireBtn.addEventListener('touchcancel', e => {
      e.preventDefault();
      endFire();
    }, { passive: false, capture: true });

    // Also listen on window for fire touch end in case finger slides off the button
    window.addEventListener('touchend', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === fireTouchId) endFire();
      }
    }, { passive: false });

    // Mouse support for fire button (desktop testing)
    fireBtn.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      startFire('mouseFire');
    });
    window.addEventListener('mouseup', e => {
      if (fireTouchId === 'mouseFire') endFire();
    });

    // Desktop mouse fallback for move stick
    let mouseMoveDown = false;
    moveZone.addEventListener('mousedown', e => {
      mouseMoveDown = true;
      startMove(e.clientX, e.clientY, 'mouse');
    });
    // Desktop mouse for aim stick (right half) + classic mouse-look
    let mouseAimDown = false;
    let usingMousePick = false;
    aimZone.addEventListener('mousedown', e => {
      if (e.button === 0) {
        mouseAimDown = true;
        startAim(e.clientX, e.clientY, 'mouseAim');
      }
    });
    // Also allow classic click-to-aim anywhere on right half of canvas for precision
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0 && e.clientX > window.innerWidth * 0.5 && !mouseAimDown) {
        usingMousePick = true;
        isShooting = true;
        updateAimFromMouse(e.clientX, e.clientY);
      }
    });
    window.addEventListener('mousemove', e => {
      if (mouseMoveDown) updateMove(e.clientX, e.clientY);
      if (mouseAimDown) updateAim(e.clientX, e.clientY);
      if (usingMousePick) updateAimFromMouse(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) {
        if (mouseMoveDown) { mouseMoveDown = false; endMove(); }
        if (mouseAimDown) { mouseAimDown = false; endAim(); }
        if (usingMousePick) {
          usingMousePick = false;
          // Only stop shooting if fire button is not held (Mode B)
          if (!fireBtnHeld && controlMode === 'A') isShooting = false;
          else if (!fireBtnHeld && controlMode === 'B' && !aimActive) isShooting = false;
        }
      }
    });

    function updateAimFromMouse(mx, my) {
      const pick = scene.pick(mx, my, m => m === ground);
      if (pick && pick.hit) {
        const dir = pick.pickedPoint.subtract(playerRoot.position);
        dir.y = 0;
        if (dir.length() > 0.15) {
          dir.normalize();
          // Smooth even for mouse
          smoothedAim = BABYLON.Vector3.Lerp(smoothedAim, dir, 0.35);
          aimDir.copyFrom(smoothedAim);
        }
      }
    }

    // Keyboard for desktop
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' || e.code === 'KeyE') tryScan();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Apply aim smoothing + assist every frame (called from main loop)
    function updateAimDirection(dt) {
      if (aimActive && rawAimInput.length() > 0.08) {
        // Convert stick to world direction (screen-relative)
        const targetDir = new BABYLON.Vector3(rawAimInput.x, 0, rawAimInput.y);
        targetDir.normalize();

        // Gentle aim assist
        let bestEnemy = null;
        let bestDot = Math.cos(AIM_ASSIST_ANGLE);
        for (const e of enemies) {
          if (!e.alive) continue;
          const toE = e.root.position.subtract(playerRoot.position);
          toE.y = 0;
          const dist = toE.length();
          if (dist > AIM_ASSIST_RANGE || dist < 0.5) continue;
          toE.normalize();
          const dot = BABYLON.Vector3.Dot(targetDir, toE);
          if (dot > bestDot) {
            bestDot = dot;
            bestEnemy = toE;
          }
        }
        if (bestEnemy) {
          targetDir.x = targetDir.x * (1 - AIM_ASSIST_STRENGTH) + bestEnemy.x * AIM_ASSIST_STRENGTH;
          targetDir.z = targetDir.z * (1 - AIM_ASSIST_STRENGTH) + bestEnemy.z * AIM_ASSIST_STRENGTH;
          targetDir.normalize();
        }

        // Smooth toward target
        const t = 1 - Math.pow(1 - AIM_SMOOTH, dt * 60);
        smoothedAim = BABYLON.Vector3.Lerp(smoothedAim, targetDir, t);
        smoothedAim.y = 0;
        if (smoothedAim.length() > 0.01) smoothedAim.normalize();
        aimDir.copyFrom(smoothedAim);
      } else if (!aimActive && !usingMousePick) {
        // When not aiming, slowly keep last direction (no reset)
      }

      // Update visual aim line (show while aiming or firing so direction stays clear)
      if (isShooting || aimActive || (controlMode === 'B' && fireBtnHeld)) {
        aimLine.isVisible = true;
        const start = playerRoot.position.add(new BABYLON.Vector3(0, 1.15, 0)).add(aimDir.scale(0.8));
        aimLine.position.copyFrom(start.add(aimDir.scale(4.5)));
        aimLine.rotation.y = Math.atan2(aimDir.x, aimDir.z);
        aimLine.rotation.x = 0;
        aimLine.rotation.z = 0;
      } else {
        aimLine.isVisible = false;
      }
    }

    // Scan ability
    function tryScan() {
      if (scanCooldown > 0 || !playerAlive) return;
      scanActive = true;
      scanTimer = SCAN_DURATION;
      scanCooldown = SCAN_CD;
      scanBtn.classList.add('active');
      showMsg('SURVEILLANCE SCAN ACTIVE', 1.2);
      // Highlight enemies
      enemies.forEach(e => {
        if (e.alive) {
          e.body.material = highlightMat;
          e.head.material = highlightMat;
        }
      });
    }
    scanBtn.addEventListener('click', e => { e.stopPropagation(); tryScan(); });
    scanBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      e.stopPropagation();
      tryScan();
    }, { passive: false, capture: true });

    // Damage & death
    function damagePlayer(amt) {
      if (!playerAlive) return;
      playerHP -= amt;
      updateHealthUI();
      if (playerHP <= 0) {
        playerHP = 0;
        playerAlive = false;
        showMsg('KIA — RESPAWNING...', 2);
        setTimeout(respawnPlayer, 2200);
      }
    }
    function respawnPlayer() {
      playerRoot.position.set(0, 0, -14);
      playerHP = maxHP;
      playerAlive = true;
      updateHealthUI();
      showMsg('REDEPLOYED', 1);
    }

    // Enemy AI update
    function updateEnemies(dt) {
      // Encounter complete — no more combat AI
      if (sectorSecured) return;

      enemies.forEach(e => {
        if (!e.alive) return;

        if (e.coverCooldown > 0) e.coverCooldown -= dt;

        const toPlayer = playerRoot.position.subtract(e.root.position);
        toPlayer.y = 0;
        const dist = toPlayer.length();
        // Surveillance advantage: active cameras extend detection range slightly
        // and help track the player when cameras are online (minimal existing-compatible bonus)
        const detectBonus = camerasOnline > 0 ? 3.5 : 0;
        const effectiveDetect = e.detectRange + detectBonus;
        const canSee = dist < effectiveDetect && playerAlive;

        let los = canSee;
        if (canSee) {
          const mid = e.root.position.add(toPlayer.scale(0.5));
          // With cameras online, weak LOS through cover for awareness only at longer range
          if (!canMoveTo(mid)) {
            if (camerasOnline > 0 && dist < effectiveDetect * 0.85) {
              los = true; // networked feed approximates position
              e.lastKnown = playerRoot.position.clone();
            } else {
              los = false;
            }
          }
        }

        // --- Cover behavior states (do not let normal AI overwrite these) ---
        if (e.state === 'seekCover') {
          e.coverFailTimer -= dt;
          if (!e.coverSpot || e.coverFailTimer <= 0) {
            e.coverSpot = null;
            e.state = los ? (dist < e.attackRange ? 'attack' : 'chase') : 'chase';
            e.alert = 3;
          } else {
            const arrived = moveToward(e, e.coverSpot.pos, e.speed * 1.15, dt);
            if (arrived) {
              e.state = 'inCover';
              e.coverHoldTimer = 0.8 + Math.random() * 0.7;
              e.peekTimer = 0;
            }
          }
          // Face player while moving if visible
          if (playerAlive && dist < 16) {
            // rotation mostly handled by moveToward
          }
          return;
        }

        if (e.state === 'inCover') {
          e.coverHoldTimer -= dt;
          // Stay near cover position; face player
          if (e.coverSpot) {
            const drift = e.root.position.subtract(e.coverSpot.pos);
            drift.y = 0;
            if (drift.length() > 0.6) {
              moveToward(e, e.coverSpot.pos, e.speed * 0.8, dt);
            }
          }
          if (playerAlive) {
            e.root.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
          }
          // After holding, peek to fire
          if (e.coverHoldTimer <= 0 && playerAlive) {
            e.state = 'peekFire';
            e.peekTimer = 1.0 + Math.random() * 0.6;
            e.shootTimer = 0.15;
          }
          // If player is very close, abandon cover and fight
          if (dist < 2.8) {
            e.state = 'attack';
            e.coverSpot = null;
            e.coverCooldown = 2.0;
          }
          return;
        }

        if (e.state === 'peekFire') {
          e.peekTimer -= dt;
          // Step slightly out from cover toward player
          if (e.coverSpot && playerAlive) {
            const outDir = toPlayer.clone();
            if (outDir.length() > 0.1) outDir.normalize();
            const peekPos = e.coverSpot.pos.add(outDir.scale(1.1));
            moveToward(e, peekPos, e.speed * 0.9, dt);
            e.root.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
            // Fire while peeking
            if (dist < e.attackRange + 2) {
              e.shootTimer -= dt;
              if (e.shootTimer <= 0) {
                e.shootTimer = 0.5 + Math.random() * 0.25;
                const dir = toPlayer.normalize();
                dir.x += (Math.random() - 0.5) * 0.1;
                dir.z += (Math.random() - 0.5) * 0.1;
                dir.normalize();
                const from = e.root.position.add(new BABYLON.Vector3(0, 1.2, 0)).add(dir.scale(0.6));
                fireBullet(from, dir, false);
              }
            }
          }
          // Return to cover or resume chase
          if (e.peekTimer <= 0) {
            if (e.coverSpot && e.hp < e.maxHp * 0.5 && e.coverCooldown > 0.5) {
              e.state = 'inCover';
              e.coverHoldTimer = 0.9 + Math.random() * 0.8;
            } else if (e.coverSpot) {
              // One more hold then leave cover cycle
              e.state = 'inCover';
              e.coverHoldTimer = 0.5;
              // Next time peek ends with low cooldown, fall through to normal AI
              if (e.coverCooldown <= 1.2) {
                e.coverSpot = null;
                e.state = los ? (dist < e.attackRange ? 'attack' : 'chase') : 'chase';
              }
            } else {
              e.state = los ? (dist < e.attackRange ? 'attack' : 'chase') : 'chase';
            }
          }
          if (dist < 2.5) {
            e.state = 'attack';
            e.coverSpot = null;
          }
          return;
        }

        // --- Standard AI (patrol / chase / attack) ---
        if (los) {
          e.state = dist < e.attackRange ? 'attack' : 'chase';
          e.lastKnown = playerRoot.position.clone();
          e.alert = 3;
        } else if (e.alert > 0) {
          e.alert -= dt;
          e.state = 'chase';
        } else {
          e.state = 'patrol';
        }

        if (e.state === 'patrol') {
          const target = e.patrolPoints[e.patrolIdx];
          const toT = target.subtract(e.root.position);
          toT.y = 0;
          if (toT.length() < 0.8) {
            e.patrolIdx = (e.patrolIdx + 1) % e.patrolPoints.length;
          } else {
            moveToward(e, target, e.speed * 0.7, dt);
          }
        } else if (e.state === 'chase' || e.state === 'attack') {
          const targetPos = e.lastKnown || playerRoot.position;
          const toT = targetPos.subtract(e.root.position);
          toT.y = 0;
          const d = toT.length();
          if (d > 2.5) {
            moveToward(e, targetPos, e.speed, dt);
          } else if (playerAlive) {
            e.root.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
          }

          if (e.state === 'attack' && playerAlive && dist < e.attackRange + 1) {
            e.shootTimer -= dt;
            if (e.shootTimer <= 0) {
              e.shootTimer = 0.55 + Math.random() * 0.3;
              const dir = toPlayer.normalize();
              dir.x += (Math.random() - 0.5) * 0.12;
              dir.z += (Math.random() - 0.5) * 0.12;
              dir.normalize();
              const from = e.root.position.add(new BABYLON.Vector3(0, 1.2, 0)).add(dir.scale(0.6));
              fireBullet(from, dir, false);
            }
          }
        }
      });
    }

    // Main loop
    let lastTime = performance.now();
    scene.registerBeforeRender(() => {
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Keyboard move (desktop) — only when not using touch/mouse stick
      if (!moveActive) {
        let kx = 0, ky = 0;
        if (keys['KeyW'] || keys['ArrowUp']) ky += 1;
        if (keys['KeyS'] || keys['ArrowDown']) ky -= 1;
        if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
        if (kx !== 0 || ky !== 0) {
          const len = Math.sqrt(kx * kx + ky * ky);
          moveInput.x = kx / len;
          moveInput.y = ky / len;
        } else {
          moveInput.set(0, 0);
        }
      }

      // Smooth aim + assist (always)
      updateAimDirection(dt);

      // Derive shooting state from the active control mode every frame
      // Mode A: shooting while aim stick is held
      // Mode B: shooting only while FIRE button is held (aim stick never fires)
      if (controlMode === 'A') {
        isShooting = aimActive || usingMousePick;
      } else {
        isShooting = fireBtnHeld || (usingMousePick && !aimActive);
      }

      if (playerAlive) {
        // Move — screen-relative (stick up = +Z)
        if (moveInput.length() > 0.05) {
          const speed = 6.2;
          const move = new BABYLON.Vector3(moveInput.x, 0, moveInput.y);
          if (move.length() > 0.01) {
            move.normalize();
            const next = playerRoot.position.add(move.scale(speed * dt));
            if (canMoveTo(next)) {
              playerRoot.position.copyFrom(next);
            } else {
              const nextX = playerRoot.position.clone(); nextX.x = next.x;
              const nextZ = playerRoot.position.clone(); nextZ.z = next.z;
              if (canMoveTo(nextX)) playerRoot.position.x = next.x;
              if (canMoveTo(nextZ)) playerRoot.position.z = next.z;
            }
            if (!isShooting && !aimActive) {
              playerRoot.rotation.y = Math.atan2(move.x, move.z);
            }
          }
        }

        // Face aim direction while aiming or firing
        if ((isShooting || aimActive) && aimDir.length() > 0.1) {
          const targetYaw = Math.atan2(aimDir.x, aimDir.z);
          let dy = targetYaw - playerRoot.rotation.y;
          while (dy > Math.PI) dy -= Math.PI * 2;
          while (dy < -Math.PI) dy += Math.PI * 2;
          playerRoot.rotation.y += dy * Math.min(1, 12 * dt);
        }

        // Shoot in current aimDir
        shootCooldown -= dt;
        if (isShooting && shootCooldown <= 0 && aimDir.length() > 0.05) {
          shootCooldown = shootRate;
          const from = playerRoot.position.add(new BABYLON.Vector3(0, 1.2, 0)).add(aimDir.scale(0.7));
          fireBullet(from, aimDir.clone(), true);
          // Muzzle flash
          muzzle.isVisible = true;
          muzzle.scaling.setAll(1.4 + Math.random() * 0.4);
          setTimeout(() => { muzzle.isVisible = false; }, 55);
          // Subtle gun recoil (does not disrupt aim)
          gunRecoil = 0.14;
          sfxShoot();
        }
        // Recover gun recoil
        if (gunRecoil > 0) {
          gunRecoil = Math.max(0, gunRecoil - dt * 1.8);
          gun.position.z = gunBasePos.z - gunRecoil * 0.55;
          gun.position.y = gunBasePos.y + gunRecoil * 0.08;
        } else {
          gun.position.copyFrom(gunBasePos);
        }
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const prevPos = b.mesh.position.clone();
        b.mesh.position.addInPlace(b.vel.scale(dt));
        b.life -= dt;
        if (b.life <= 0) {
          b.mesh.material.dispose();
          b.mesh.dispose();
          bullets.splice(i, 1);
          continue;
        }
        // Hit player?
        if (!b.isPlayer && playerAlive) {
          const d = BABYLON.Vector3.Distance(b.mesh.position, playerRoot.position.add(new BABYLON.Vector3(0,1,0)));
          if (d < 0.6) {
            damagePlayer(12 + Math.random() * 6);
            spawnFlash(b.mesh.position.clone(), new BABYLON.Color3(1, 0.3, 0.2), 0.35, 0.1);
            b.mesh.material.dispose();
            b.mesh.dispose();
            bullets.splice(i, 1);
            continue;
          }
        }
        // Hit enemies
        if (b.isPlayer) {
          let hit = false;
          for (const e of enemies) {
            if (!e.alive || e.collapsing) continue;
            const d = BABYLON.Vector3.Distance(b.mesh.position, e.root.position.add(new BABYLON.Vector3(0, 1.0, 0)));
            if (d < 1.05) {
              const hitDir = b.dir ? b.dir.clone() : b.vel.normalize();
              damageEnemy(e, 22, hitDir);
              b.mesh.material.dispose();
              b.mesh.dispose();
              bullets.splice(i, 1);
              hit = true;
              break;
            }
          }
          if (hit) continue;
          // Hit surveillance cameras (mission objectives)
          // Cameras are elevated (~y 2.9). Player bullets travel horizontally at ~y 1.2,
          // so a pure 3D distance check never triggers. Use XZ proximity (aligned with
          // the visual model) plus a vertical window so elevated cameras are targetable
          // from the isometric view without letting shots pass through walls (wall check
          // still runs if no camera is hit).
          for (let ci = 0; ci < cameras.length; ci++) {
            const cam = cameras[ci];
            if (!cam.alive) continue;
            const camWorld = cam.root.position;
            const dx = b.mesh.position.x - camWorld.x;
            const dz = b.mesh.position.z - camWorld.z;
            const xzDist = Math.sqrt(dx * dx + dz * dz);
            const camY = cam.body.getAbsolutePosition().y;
            const bulletY = b.mesh.position.y;
            // Hit if aimed at the camera's XZ (radius ~1.35) and bullet is in the
            // vertical span from typical fire height up through the camera body.
            if (xzDist < 1.35 && bulletY > camY - 2.4 && bulletY < camY + 0.8) {
              damageCamera(cam, 20, cam.body.getAbsolutePosition().clone());
              b.mesh.material.dispose();
              b.mesh.dispose();
              bullets.splice(i, 1);
              hit = true;
              break;
            }
          }
          if (hit) continue;
        }
        // Hit static cover / walls (AABB check against collision meshes)
        let wallHit = false;
        if (Math.abs(b.mesh.position.x) > 21 || Math.abs(b.mesh.position.z) > 21) {
          wallHit = true;
        } else {
          const obstacles = scene.meshes;
          for (let oi = 0; oi < obstacles.length; oi++) {
            const o = obstacles[oi];
            if (!o.checkCollisions) continue;
            const bb = o.getBoundingInfo().boundingBox;
            const min = bb.minimumWorld;
            const max = bb.maximumWorld;
            const p = b.mesh.position;
            if (p.x > min.x && p.x < max.x && p.y > min.y && p.y < max.y && p.z > min.z && p.z < max.z) {
              wallHit = true;
              break;
            }
          }
        }
        if (wallHit) {
          spawnFlash(b.mesh.position.clone(), new BABYLON.Color3(1, 0.85, 0.4), 0.28, 0.09);
          spawnSparks(b.mesh.position.clone(), 3);
          sfxImpact();
          b.mesh.material.dispose();
          b.mesh.dispose();
          bullets.splice(i, 1);
        }
      }

      // Enemy feedback (flinch / collapse) — before AI so dead ones are skipped
      for (const e of enemies) {
        updateEnemyFeedback(e, dt);
      }

      // Camera hit-flash recovery
      for (let ci = 0; ci < cameras.length; ci++) {
        const cam = cameras[ci];
        if (cam.alive && cam.hitFlashTimer > 0) {
          cam.hitFlashTimer -= dt;
          if (cam.hitFlashTimer <= 0) {
            cam.body.material = camBodyMat;
            cam.lite.scaling.setAll(1);
          }
        }
      }

      updateFx(dt);
      updateEnemies(dt);

      // Scan
      if (scanActive) {
        scanTimer -= dt;
        if (scanTimer <= 0) {
          scanActive = false;
          enemies.forEach(e => {
            if (e.alive) {
              e.body.material = enemyMat;
              e.head.material = enemyMat;
            }
          });
        }
      }
      if (scanCooldown > 0) {
        scanCooldown -= dt;
        scanBtn.classList.add('cooldown');
        scanBtn.querySelector('#scanLabel').textContent = Math.ceil(scanCooldown) + 's';
        if (scanCooldown <= 0) {
          scanBtn.classList.remove('cooldown', 'active');
          scanBtn.querySelector('#scanLabel').textContent = 'SCAN';
        }
      }
    });

    // ========== VIEWPORT / ORIENTATION (iOS Safari) ==========
    // Cause of prior failure: layout used static viewport units and optional inline
    // pixel sizes that did not reliably update after rotate. iOS Safari also cannot
    // lock orientation for normal tabs — the page must follow the visual viewport.
    //
    // Fix: drive #gameShell size from CSS variables updated from visualViewport
    // on every resize/orientationchange, then call engine.resize() without
    // rebuilding the scene. body.efe-landscape / efe-portrait toggles HUD CSS.
    const rotateOverlay = document.getElementById('rotateOverlay');
    const orientTitle = document.getElementById('orientTitle');
    const orientMsg = document.getElementById('orientMsg');
    const initErrorEl = document.getElementById('initError');
    const gameShell = document.getElementById('gameShell');
    let resizeTimer = null;

    function showInitError(msg) {
      if (!initErrorEl) return;
      initErrorEl.textContent = 'INIT: ' + msg;
      initErrorEl.classList.add('show');
      console.error('[EFE]', msg);
    }

    function getViewportSize() {
      var vv = window.visualViewport;
      var w = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth || 0);
      var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 0);
      return { w: w, h: h };
    }

    // Physical device orientation (may disagree with viewport if OS portrait-lock is on)
    function physicalIsLandscape() {
      try {
        if (typeof window.orientation === 'number') {
          return Math.abs(window.orientation) === 90;
        }
        if (screen.orientation && typeof screen.orientation.angle === 'number') {
          return Math.abs(screen.orientation.angle) === 90;
        }
      } catch (e) {}
      return false;
    }

    function applyViewportLayout() {
      var s = getViewportSize();
      if (s.w < 16 || s.h < 16) return s;

      // CSS variables drive the full-screen shell (works across orientation changes)
      document.documentElement.style.setProperty('--efe-w', s.w + 'px');
      document.documentElement.style.setProperty('--efe-h', s.h + 'px');

      var landscape = s.w >= s.h;
      document.body.classList.toggle('efe-landscape', landscape);
      document.body.classList.toggle('efe-portrait', !landscape);

      // Resize Babylon to the shell's client box (no scene rebuild)
      if (engine) {
        var dpr = window.devicePixelRatio || 1;
        engine.setHardwareScalingLevel(dpr / Math.min(dpr, 1.5));
        engine.resize();
      }

      // Soft tips
      if (rotateOverlay) {
        var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        var lockedMismatch = touch && physicalIsLandscape() && !landscape;
        if (lockedMismatch) {
          // Phone is sideways but Safari viewport stayed portrait → OS orientation lock
          if (orientTitle) orientTitle.textContent = 'ORIENTATION LOCKED';
          if (orientMsg) orientMsg.textContent = 'Turn OFF the Portrait Lock in Control Center (lock icon), then rotate your phone again.';
          rotateOverlay.classList.add('show');
        } else if (touch && !landscape) {
          if (orientTitle) orientTitle.textContent = 'LANDSCAPE RECOMMENDED';
          if (orientMsg) orientMsg.textContent = 'Turn your phone sideways for the best controls. Gameplay works in portrait too.';
          rotateOverlay.classList.add('show');
        } else {
          rotateOverlay.classList.remove('show');
        }
      }

      // Temporary size readout (confirms reflow after rotate)
      if (initErrorEl) {
        initErrorEl.textContent = (landscape ? 'LANDSCAPE' : 'PORTRAIT') + ' ' + s.w + 'x' + s.h;
        initErrorEl.classList.add('show');
        initErrorEl.style.background = landscape ? 'rgba(20,50,30,0.9)' : 'rgba(40,40,20,0.9)';
        initErrorEl.style.borderColor = landscape ? '#3a6a4a' : '#6a6a3a';
        initErrorEl.style.color = '#cfc';
      }
      return s;
    }

    function doResize() {
      try {
        applyViewportLayout();
      } catch (err) {
        showInitError('resize failed: ' + (err && err.message ? err.message : err));
      }
    }

    function scheduleResize() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        doResize();
      }, 16);
    }

    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', function () {
      doResize();
      setTimeout(doResize, 50);
      setTimeout(doResize, 150);
      setTimeout(doResize, 400);
      setTimeout(doResize, 800);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleResize);
      window.visualViewport.addEventListener('scroll', scheduleResize);
    }
    try {
      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', scheduleResize);
      }
    } catch (e) {}
    try {
      var mql = window.matchMedia('(orientation: landscape)');
      var onMql = function () { scheduleResize(); };
      if (mql.addEventListener) mql.addEventListener('change', onMql);
      else if (mql.addListener) mql.addListener(onMql);
    } catch (e) {}

    // Joystick touches already use clientX/clientY (viewport space). After --efe-w/h
    // update, zone boxes are percentage of the shell, so mapping stays correct.

    try {
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    } catch (e) {}

    try {
      updateMissionHud();
      updateHealthUI();
      doResize();
      setTimeout(doResize, 100);
      setTimeout(doResize, 400);
      showMsg('MISSION: FIRST SIGNAL\nOBJECTIVE: DISABLE R.E.D. SURVEILLANCE', 2.8);
      engine.runRenderLoop(function () {
        try { scene.render(); } catch (err) {}
      });
    } catch (err) {
      showInitError('startup failed: ' + (err && err.message ? err.message : err));
    }
  })();
  </script>
</body>
</html>
