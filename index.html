<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>EFE: Shadow Protocol</title>
  <!-- Production notes: README.md | assets/manifest.json -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --efe-w: 100vw;
      --efe-h: 100vh;
    }
    html, body {
      overflow: hidden;
      background: #0a0a0f;
      touch-action: none;
      position: fixed;
      top: 0; left: 0;
      width: var(--efe-w);
      height: var(--efe-h);
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      margin: 0; padding: 0;
    }
    /* Full-screen game shell — sized from JS-updated CSS variables */
    #gameShell {
      position: fixed;
      top: 0; left: 0;
      width: var(--efe-w);
      height: var(--efe-h);
      overflow: hidden;
      z-index: 0;
    }
    #renderCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      z-index: 0;
      transform: none !important;
    }
    #ui {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
      user-select: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      z-index: 1;
      box-sizing: border-box;
    }
    /* Joystick zones — percentages of the live game shell */
    #moveZone {
      position: absolute;
      bottom: 0; left: 0;
      width: 42%;
      height: 55%;
      pointer-events: auto;
      z-index: 2;
    }
    #aimZone {
      position: absolute;
      bottom: 0; right: 0;
      width: 42%;
      height: 55%;
      pointer-events: auto;
      z-index: 2;
    }
    /* Wide viewport = landscape layout (dimension-based, not only orientation media) */
    body.efe-landscape #moveZone { width: 36%; height: 75%; }
    body.efe-landscape #aimZone { width: 36%; height: 75%; }
    body.efe-landscape #healthBar,
    body.efe-landscape #healthText { width: min(140px, 22vw); }
    body.efe-landscape #scanBtn { width: 54px; height: 54px; }
    body.efe-portrait #moveZone { width: 48%; height: 42%; }
    body.efe-portrait #aimZone { width: 48%; height: 42%; }
    #healthBar {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: calc(12px + env(safe-area-inset-left, 0px));
      width: min(160px, 28vw); height: 16px;
      background: rgba(20,20,30,0.85); border: 1px solid #333; border-radius: 4px; overflow: hidden;
      z-index: 6;
    }
    #healthFill {
      height: 100%; width: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c);
      transition: width 0.2s ease;
    }
    #healthText {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: calc(12px + env(safe-area-inset-left, 0px));
      width: min(160px, 28vw); height: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-shadow: 0 1px 2px #000;
      z-index: 7;
    }
    #missionHud {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: 50%; transform: translateX(-50%);
      background: rgba(12,16,28,0.9); border: 1px solid #3a4555; border-radius: 6px;
      padding: 5px 12px 6px; z-index: 6; text-align: center;
      min-width: 160px; max-width: 70vw;
    }
    #missionHud .missionTitle {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: #8ab4f8;
      margin-bottom: 3px;
    }
    #missionHud .missionLine {
      font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      color: #e8c0a0; line-height: 1.35; white-space: nowrap;
    }
    #missionHud .missionLine.cleared { color: #8f8; }
    #missionHud.complete {
      border-color: #3a6a3a;
    }
    #missionHud.complete .missionTitle { color: #8f8; }
    body.efe-landscape #missionHud { padding: 4px 10px; }
    body.efe-landscape #missionHud .missionTitle { font-size: 9px; }
    body.efe-landscape #missionHud .missionLine { font-size: 9px; }
    #ammo {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%);
      font-size: 12px; font-weight: 600; background: rgba(20,20,30,0.8);
      padding: 4px 12px; border-radius: 6px; border: 1px solid #333; letter-spacing: 1px;
      z-index: 5;
    }
    #msg {
      position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(16px, 4.5vw, 24px); font-weight: 700; text-align: center;
      text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      z-index: 20; max-width: 90%; line-height: 1.35;
    }
    #msg.show { opacity: 1; }
    .joyBase {
      position: absolute; width: 120px; height: 120px; border-radius: 50%;
      background: rgba(30,40,60,0.4); border: 2px solid rgba(100,140,200,0.35);
      display: none; pointer-events: none;
    }
    .joyKnob {
      position: absolute; width: 54px; height: 54px; border-radius: 50%;
      top: 33px; left: 33px; pointer-events: none;
    }
    #moveBase { border-color: rgba(100,160,255,0.4); }
    #moveKnob {
      background: rgba(100,160,255,0.6); border: 2px solid rgba(150,200,255,0.8);
    }
    #aimBase { border-color: rgba(255,140,80,0.45); }
    #aimKnob {
      background: rgba(255,140,80,0.65); border: 2px solid rgba(255,180,120,0.85);
    }
    #title {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.2px; color: #8ab4f8; opacity: 0.75; z-index: 5;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 28px; height: 28px;
      transform: translate(-50%, -50%); pointer-events: none; opacity: 0.85; z-index: 5;
    }
    #crosshair .ch-h, #crosshair .ch-v {
      position: absolute; background: #7ec8ff;
      box-shadow: 0 0 4px rgba(100,200,255,0.8);
    }
    #crosshair .ch-h { width: 28px; height: 2px; top: 13px; left: 0; }
    #crosshair .ch-v { width: 2px; height: 28px; left: 13px; top: 0; }
    #crosshair .ch-dot {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: #fff; top: 12px; left: 12px;
      box-shadow: 0 0 6px #7ec8ff;
    }
    #aimHint {
      position: absolute;
      bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      font-size: 9px; color: rgba(255,180,120,0.5); letter-spacing: 0.5px;
      pointer-events: none; z-index: 5;
    }
    /* FIRE button — Mode B only; clear of SCAN and aim stick */
    #fireBtn {
      position: absolute;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      right: calc(92px + env(safe-area-inset-right, 0px));
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(90, 18, 18, 0.95);
      border: 3px solid #ff3b3b;
      display: none;
      align-items: center; justify-content: center; flex-direction: column;
      pointer-events: auto; cursor: pointer;
      transition: transform 0.08s, background 0.08s, box-shadow 0.08s;
      box-shadow: 0 0 16px rgba(255, 50, 50, 0.55);
      z-index: 30; touch-action: none; user-select: none;
    }
    #fireBtn.visible { display: flex; }
    #fireBtn.pressed, #fireBtn:active {
      background: rgba(200, 30, 30, 0.98);
      transform: scale(0.92);
    }
    #fireIcon { font-size: 18px; line-height: 1; pointer-events: none; }
    #fireLabel {
      font-size: 9px; margin-top: 2px; letter-spacing: 1px;
      color: #ffc8c0; font-weight: 700; pointer-events: none;
    }
    #scanBtn {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      width: 60px; height: 60px;
      border-radius: 50%; background: rgba(20,30,50,0.9); border: 2px solid #3a7bd5;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      pointer-events: auto; cursor: pointer; transition: all 0.15s;
      box-shadow: 0 0 12px rgba(58,123,213,0.4);
      z-index: 30; touch-action: none;
    }
    #scanBtn:active, #scanBtn.active { background: rgba(58,123,213,0.5); transform: scale(0.94); }
    #scanBtn.cooldown { border-color: #555; box-shadow: none; opacity: 0.6; }
    #scanIcon { font-size: 18px; line-height: 1; pointer-events: none; }
    #scanLabel { font-size: 8px; margin-top: 2px; letter-spacing: 0.5px; color: #8ab4f8; pointer-events: none; }
    #modeToggle {
      position: absolute;
      top: calc(32px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      pointer-events: auto; cursor: pointer;
      background: rgba(20,25,40,0.92); border: 1px solid #3a5a80; border-radius: 5px;
      padding: 5px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.4px;
      color: #8ab4f8; z-index: 40; user-select: none; touch-action: none;
    }
    #modeToggle:active { background: rgba(40,55,80,0.95); }
    #modeLabel { font-size: 8px; color: #6a8aaa; margin-top: 1px; }
    #audioTestBtn {
      position: absolute;
      top: calc(72px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      pointer-events: auto; cursor: pointer;
      background: rgba(40, 80, 40, 0.92); border: 1px solid #4caf50; border-radius: 5px;
      padding: 5px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      color: #b8f0b8; z-index: 40; user-select: none; touch-action: none;
    }
    #audioTestBtn:active { background: rgba(60, 120, 60, 1); transform: scale(0.96); }
    #audioStatus {
      position: absolute;
      top: calc(104px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      pointer-events: none;
      background: rgba(10, 12, 20, 0.85); border: 1px solid #333; border-radius: 4px;
      padding: 3px 7px; font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
      color: #aaa; z-index: 40; text-align: center;
    }
    #audioStatus.running { color: #6f6; border-color: #3a6a3a; }
    #audioStatus.suspended { color: #fc6; border-color: #6a5a2a; }
    #audioStatus.unavailable { color: #f66; border-color: #6a2a2a; }
    /* Replay — shown only when sector is secured */
    #replayBtn {
      position: absolute;
      top: 58%; left: 50%; transform: translate(-50%, 0);
      display: none; pointer-events: auto; cursor: pointer;
      background: rgba(20, 40, 70, 0.95); border: 2px solid #4a9eff;
      border-radius: 8px; padding: 12px 28px;
      font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: #c8e0ff;
      z-index: 25; touch-action: none; user-select: none;
      box-shadow: 0 0 20px rgba(60, 140, 255, 0.35);
    }
    #replayBtn.visible { display: block; }
    #replayBtn:active { background: rgba(40, 70, 120, 1); transform: translate(-50%, 0) scale(0.96); }
    /* Soft portrait hint — does NOT cover the full screen or block touches.
       Game remains playable even if orientation detection is wrong. */
    #rotateOverlay {
      display: none;
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: rgba(6, 8, 14, 0.88);
      border: 1px solid #3a5a80;
      border-radius: 8px;
      flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
      text-align: center;
      padding: 10px 16px;
      font-family: system-ui, -apple-system, sans-serif; color: #c8d4e8;
      max-width: 90vw;
    }
    #rotateOverlay.show { display: flex; }
    #rotateOverlay .icon { font-size: 22px; margin-bottom: 4px; }
    #rotateOverlay h2 {
      font-size: 12px; letter-spacing: 1.5px; margin-bottom: 2px; color: #8ab4f8;
    }
    #rotateOverlay p { font-size: 10px; opacity: 0.7; max-width: 220px; line-height: 1.3; }
    #initError {
      display: none; position: fixed; bottom: 12px; left: 12px; right: 12px;
      z-index: 200; background: rgba(80,20,20,0.95); border: 1px solid #c44;
      color: #fcc; font-size: 11px; padding: 8px 10px; border-radius: 6px;
      font-family: ui-monospace, monospace; pointer-events: none;
      max-height: 30vh; overflow: auto; white-space: pre-wrap;
    }
    #initError.show { display: block; }
  </style>
</head>
<body>
  <div id="gameShell">
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <div id="title">EFE: SHADOW PROTOCOL</div>
    <div id="missionHud">
      <div class="missionTitle">MISSION: FIRST SIGNAL</div>
      <div class="missionLine" id="camerasLine">CAMERAS ONLINE: <span id="camerasCount">3</span></div>
      <div class="missionLine" id="hostilesLine">HOSTILES REMAINING: <span id="hostilesCount">3</span></div>
    </div>
    <div id="modeToggle">
      <div>MODE <span id="modeName">A</span></div>
      <div id="modeLabel">Twin-Stick Fire</div>
    </div>
    <div id="audioTestBtn">TEST SOUND</div>
    <div id="audioStatus">AUDIO: —</div>
    <div id="healthBar"><div id="healthFill"></div></div>
    <div id="healthText">100</div>
    <div id="ammo">∞</div>
    <div id="moveZone">
      <div id="moveBase" class="joyBase"><div id="moveKnob" class="joyKnob"></div></div>
    </div>
    <div id="aimZone">
      <div id="aimBase" class="joyBase"><div id="aimKnob" class="joyKnob"></div></div>
    </div>
    <div id="fireBtn">
      <div id="fireIcon">🔥</div>
      <div id="fireLabel">FIRE</div>
    </div>
    <div id="scanBtn">
      <div id="scanIcon">📡</div>
      <div id="scanLabel">SCAN</div>
    </div>
    <div id="aimHint">AIM / FIRE</div>
    <div id="crosshair">
      <div class="ch-h"></div><div class="ch-v"></div><div class="ch-dot"></div>
    </div>
    <div id="msg"></div>
    <div id="replayBtn">REPLAY</div>
  </div>
  </div><!-- /gameShell -->
  <div id="rotateOverlay">
    <div class="icon">📱</div>
    <h2 id="orientTitle">LANDSCAPE RECOMMENDED</h2>
    <p id="orientMsg">Turn your phone sideways for the best controls. Gameplay works in portrait too.</p>
  </div>
  <div id="initError"></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
  (function() {
    const canvas = document.getElementById('renderCanvas');
    let engine, scene;
    try {
      // adaptToDeviceRatio helps iOS after rotation; limit DPR for perf
      engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: false,
        stencil: true,
        adaptToDeviceRatio: false,
        powerPreference: 'default',
        failIfMajorPerformanceCaveat: false
      });
      // hardwareScalingLevel > 1 = lower res. Cap effective DPR at 1.5 for mobile stability.
      var dpr = window.devicePixelRatio || 1;
      engine.setHardwareScalingLevel(dpr / Math.min(dpr, 1.5));
    } catch (err) {
      const el = document.getElementById('initError');
      if (el) {
        el.textContent = 'INIT: WebGL engine failed — ' + (err && err.message ? err.message : err);
        el.classList.add('show');
      }
      throw err;
    }

    // Critical for iOS Safari: prevent permanent context loss on rotate
    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      console.warn('[EFE] WebGL context lost (often on rotate) — awaiting restore');
    }, false);
    canvas.addEventListener('webglcontextrestored', function () {
      console.warn('[EFE] WebGL context restored — resizing engine');
      try {
        if (engine) {
          engine.resize();
          // Force a few frames after restore
          setTimeout(function () { if (engine) engine.resize(); }, 50);
          setTimeout(function () { if (engine) engine.resize(); }, 200);
        }
      } catch (err) {
        console.error('[EFE] restore resize failed', err);
      }
    }, false);

    scene = new BABYLON.Scene(engine);
    // Warm industrial atmosphere (EFE concept)
    scene.clearColor = new BABYLON.Color4(0.06, 0.04, 0.03, 1);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.014;
    scene.fogColor = new BABYLON.Color3(0.12, 0.06, 0.03);

    // Lights — warm burnt-orange industrial
    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.15, 1, 0.2), scene);
    hemi.intensity = 0.42;
    hemi.diffuse = new BABYLON.Color3(0.85, 0.6, 0.38);
    hemi.groundColor = new BABYLON.Color3(0.1, 0.06, 0.05);
    hemi.specular = new BABYLON.Color3(0.25, 0.18, 0.1);

    const dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-0.35, -0.85, -0.25), scene);
    dir.position = new BABYLON.Vector3(18, 28, 12);
    dir.intensity = 0.62;
    dir.diffuse = new BABYLON.Color3(1.0, 0.5, 0.22);
    dir.shadowEnabled = true;

    const shadowGen = new BABYLON.ShadowGenerator(512, dir); // lighter for mobile
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 12;
    shadowGen.setDarkness(0.45);

    // Warm industrial point lights (surveillance / furnace glow)
    const warm1 = new BABYLON.PointLight('warm1', new BABYLON.Vector3(-8, 4, 6), scene);
    warm1.intensity = 0.45;
    warm1.diffuse = new BABYLON.Color3(1.0, 0.4, 0.12);
    warm1.range = 16;
    const warm2 = new BABYLON.PointLight('warm2', new BABYLON.Vector3(10, 3.5, -8), scene);
    warm2.intensity = 0.38;
    warm2.diffuse = new BABYLON.Color3(1.0, 0.38, 0.1);
    warm2.range = 14;
    const warm3 = new BABYLON.PointLight('warm3', new BABYLON.Vector3(0, 5, 0), scene);
    warm3.intensity = 0.22;
    warm3.diffuse = new BABYLON.Color3(0.9, 0.35, 0.08);
    warm3.range = 18;

    // Ground
    const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 48, height: 48 }, scene);
    const groundMat = new BABYLON.StandardMaterial('gMat', scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.14, 0.11, 0.09); // wet concrete
    groundMat.specularColor = new BABYLON.Color3(0.25, 0.18, 0.1); // orange-tinted reflections
    groundMat.specularPower = 32;
    groundMat.emissiveColor = new BABYLON.Color3(0.015, 0.008, 0.004);
    ground.material = groundMat;
    ground.receiveShadows = true;

    // Grid lines for tactical feel
    const gridMat = new BABYLON.StandardMaterial('grid', scene);
    gridMat.diffuseColor = new BABYLON.Color3(0.18, 0.2, 0.24);
    gridMat.emissiveColor = new BABYLON.Color3(0.02, 0.03, 0.04);
    gridMat.alpha = 0.6;
    for (let i = -20; i <= 20; i += 4) {
      const lineZ = BABYLON.MeshBuilder.CreateBox('gz'+i, { width: 40, height: 0.02, depth: 0.04 }, scene);
      lineZ.position = new BABYLON.Vector3(0, 0.02, i);
      lineZ.material = gridMat;
      const lineX = BABYLON.MeshBuilder.CreateBox('gx'+i, { width: 0.04, height: 0.02, depth: 40 }, scene);
      lineX.position = new BABYLON.Vector3(i, 0.02, 0);
      lineX.material = gridMat;
    }

    // Materials
    const wallMat = new BABYLON.StandardMaterial('wall', scene);
    wallMat.diffuseColor = new BABYLON.Color3(0.24, 0.2, 0.17); // weathered concrete, slightly lighter for readability
    wallMat.specularColor = new BABYLON.Color3(0.04, 0.03, 0.02);
    wallMat.emissiveColor = new BABYLON.Color3(0.012, 0.006, 0.004);

    const crateMat = new BABYLON.StandardMaterial('crate', scene);
    crateMat.diffuseColor = new BABYLON.Color3(0.48, 0.24, 0.12); // brighter rust for cover readability
    crateMat.specularColor = new BABYLON.Color3(0.1, 0.05, 0.02);
    crateMat.emissiveColor = new BABYLON.Color3(0.018, 0.006, 0.002);

    const darkMat = new BABYLON.StandardMaterial('dark', scene);
    darkMat.diffuseColor = new BABYLON.Color3(0.08, 0.08, 0.1);
    const qrMat = new BABYLON.StandardMaterial('qr', scene);
    qrMat.diffuseColor = new BABYLON.Color3(0.85, 0.85, 0.82);
    qrMat.emissiveColor = new BABYLON.Color3(0.15, 0.15, 0.14);
    qrMat.disableLighting = true;

    const metalMat = new BABYLON.StandardMaterial('metal', scene);
    metalMat.diffuseColor = new BABYLON.Color3(0.35, 0.18, 0.1); // rusted barrier
    metalMat.specularColor = new BABYLON.Color3(0.15, 0.08, 0.04);
    metalMat.specularPower = 16;
    metalMat.emissiveColor = new BABYLON.Color3(0.01, 0.004, 0.001);

    // Arena walls (outer)
    function makeWall(x, z, w, d, h = 3.2) {
      const m = BABYLON.MeshBuilder.CreateBox('w', { width: w, height: h, depth: d }, scene);
      m.position = new BABYLON.Vector3(x, h/2, z);
      m.material = wallMat;
      m.receiveShadows = true;
      shadowGen.addShadowCaster(m);
      m.checkCollisions = true;
      return m;
    }
    // Outer boundary
    makeWall(0, -22, 44, 1.2);
    makeWall(0, 22, 44, 1.2);

    function canMoveTo(pos) {
      // Simple AABB against static obstacles
      const obstacles = scene.meshes.filter(m => m.checkCollisions && m !== playerBody && m !== head);
      for (const o of obstacles) {
        const bb = o.getBoundingInfo().boundingBox;
        const min = bb.minimumWorld;
        const max = bb.maximumWorld;
        // Expand by player radius
        if (pos.x + playerRadius > min.x && pos.x - playerRadius < max.x &&
            pos.z + playerRadius > min.z && pos.z - playerRadius < max.z) {
          // Only block if height overlaps roughly
          if (max.y > 0.3) return false;

      // Bounds

    // ========== AUDIO (iOS-safe Web Audio) ==========
    // Mobile browsers require AudioContext.resume() inside a real user gesture.
    // resume() is async — we must wait for it before starting oscillators.
    let audioCtx = null;
    let masterGain = null;
    let audioReady = false;
    let audioFailReason = '';
    const audioStatusEl = document.getElementById('audioStatus');
    const audioTestBtn = document.getElementById('audioTestBtn');

    function setAudioStatus(state, detail) {
      if (!audioStatusEl) return;
      audioStatusEl.className = '';
      if (state === 'running') {
        audioStatusEl.classList.add('running');
        audioStatusEl.textContent = 'AUDIO: ON';
      } else if (state === 'suspended') {
        audioStatusEl.classList.add('suspended');
        audioStatusEl.textContent = 'AUDIO: TAP TO ENABLE';
      } else if (state === 'unavailable') {
        audioStatusEl.classList.add('unavailable');
        audioStatusEl.textContent = 'AUDIO: UNAVAILABLE';
      } else {
        audioStatusEl.textContent = detail || 'AUDIO: —';
      }
    }

    function createAudioContext() {
      if (audioCtx) return audioCtx;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) {
          audioFailReason = 'No AudioContext API';
          setAudioStatus('unavailable');
          return null;
        }
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        // Higher master volume for phone speakers
        masterGain.gain.value = 0.85;
        masterGain.connect(audioCtx.destination);
        return audioCtx;
      } catch (err) {
        audioFailReason = String(err && err.message ? err.message : err);
        setAudioStatus('unavailable');
        return null;
      }
    }

    // Must be called from a user gesture (touch/click). Returns a Promise.
    function unlockAudio() {
      const ctx = createAudioContext();
      if (!ctx) return Promise.resolve(false);
      if (ctx.state === 'running') {
        audioReady = true;
        setAudioStatus('running');
        return Promise.resolve(true);
      }
      // iOS Safari: resume() must happen in the gesture stack
      return ctx.resume().then(() => {
        if (ctx.state === 'running') {
          audioReady = true;
          setAudioStatus('running');
          return true;
        }
        setAudioStatus('suspended');
        return false;
      }).catch(err => {
        audioFailReason = String(err && err.message ? err.message : err);
        setAudioStatus('suspended');
        return false;
      });
    }

    // Keep status in sync (context can suspend again when tab backgrounds)
    function refreshAudioStatus() {
      if (!audioCtx) {
        setAudioStatus('suspended');
        return;
      }
      if (audioCtx.state === 'running') {
        audioReady = true;
        setAudioStatus('running');
      } else if (audioCtx.state === 'suspended') {
        audioReady = false;
        setAudioStatus('suspended');
      } else {
        setAudioStatus('unavailable');
      }
    }
    setInterval(refreshAudioStatus, 1500);

    // Unlock on any early interaction (does not auto-play a sound)
    function gestureUnlock(e) {
      unlockAudio();
    }
    document.addEventListener('touchstart', gestureUnlock, { passive: true, capture: true });
    document.addEventListener('touchend', gestureUnlock, { passive: true, capture: true });
    document.addEventListener('mousedown', gestureUnlock, { passive: true, capture: true });
    document.addEventListener('keydown', gestureUnlock, { passive: true, capture: true });

    // Play a tone only when context is running. Uses linear ramps (more reliable on iOS).
    function playTone(freq, dur, type, vol, slideTo) {
      if (!audioCtx || audioCtx.state !== 'running' || !masterGain) return;
      try {
        const t0 = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo != null) {
          osc.frequency.linearRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
        }
        const peak = Math.min(1, vol != null ? vol : 0.35);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(peak, t0 + 0.012);
        gain.gain.linearRampToValueAtTime(0.001, t0 + Math.max(0.03, dur));
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
        // Cleanup nodes after playback
        osc.onended = () => {
          try { osc.disconnect(); gain.disconnect(); } catch (e) {}
        };
      } catch (err) {
        // Swallow to avoid spamming console during rapid fire
      }
    }

    // Louder, clearer SFX tuned for phone speakers

    // ========== COMBAT FX POOLS (reuse for mobile) ==========
    const fxPool = [];
    function spawnFlash(pos, color, scale, life) {
      let m = fxPool.pop();
      if (!m) {
        m = BABYLON.MeshBuilder.CreateSphere('fx', { diameter: 1, segments: 4 }, scene);
        const mat = new BABYLON.StandardMaterial('fxMat', scene);

        m.material = mat;
        m.isPickable = false;
      } else {
        m.material.emissiveColor.copyFrom(color);
        m.material.alpha = 0.85;
        m.setEnabled(true);
      }
      m.position.copyFrom(pos);
      m.scaling.setAll(scale);
      const entry = { mesh: m, life: life || 0.12, maxLife: life || 0.12, baseScale: scale };
      activeFx.push(entry);

    const activeFx = [];

    function spawnSparks(pos, count) {
      for (let i = 0; i < count; i++) {
        const dir = new BABYLON.Vector3(
          (Math.random() - 0.5) * 2,
          Math.random() * 1.2,
          (Math.random() - 0.5) * 2
        ).normalize();
        const m = BABYLON.MeshBuilder.CreateSphere('spk', { diameter: 0.08, segments: 3 }, scene);
        const mat = new BABYLON.StandardMaterial('spkM', scene);

        });

    }

    function updateFx(dt) {
      for (let i = activeFx.length - 1; i >= 0; i--) {
        const f = activeFx[i];
        f.life -= dt;
        if (f.vel) {
          f.mesh.position.addInPlace(f.vel.scale(dt));
          f.vel.y -= 8 * dt;
          f.vel.scaleInPlace(0.92);
        }
        const t = Math.max(0, f.life / f.maxLife);
        f.mesh.material.alpha = t * 0.9;
        const s = f.baseScale * (0.6 + t * 0.8);
        f.mesh.scaling.setAll(s);
        if (f.life <= 0) {
          if (f.isSpark) {
            f.mesh.material.dispose();
            f.mesh.dispose();
          } else {
            f.mesh.setEnabled(false);
            fxPool.push(f.mesh);
          }
          activeFx.splice(i, 1);
        }
      }
    }
